<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebDeBloater</title>
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="9" x2="15" y2="15"></line>
          <line x1="15" y1="9" x2="9" y2="15"></line>
        </svg>
      </div>
      <div class="title-container">
        <h1 data-i18n="popup_title">WebDeBloater</h1>
        <span class="version" id="version"></span>
      </div>
    </header>

    <main class="popup-main">
      <section class="section toggle-section">
        <label class="toggle-label">
          <input type="checkbox" id="enabled-toggle" class="toggle-input" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-text" data-i18n="popup_enabled">Attivo</span>
        </label>
        <p class="toggle-description" data-i18n="popup_enabled_desc">Blocca banner "Apri nell'app" e simili</p>
      </section>

      <section class="section stats-section">
        <div class="stat">
          <span class="stat-value" id="session-stats">0</span>
          <span class="stat-label" data-i18n="popup_session_removed">Questa sessione</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="total-stats">0</span>
          <span class="stat-label" data-i18n="popup_total_removed">Totale rimossi</span>
        </div>
      </section>

      <section class="section domain-section">
        <label for="whitelist-toggle" class="domain-label">
          <span data-i18n="popup_whitelist_domain">Questo sito:</span>
          <label class="toggle-label small">
            <input type="checkbox" id="whitelist-toggle" class="toggle-input">
            <span class="toggle-slider"></span>
            <span class="toggle-text" data-i18n="popup_whitelist_on">Whitelist</span>
          </label>
        </label>
        <p class="domain-hint" data-i18n="popup_whitelist_hint">I banner non verranno bloccati su questo dominio</p>
      </section>
    </main>

    <footer class="popup-footer">
      <button class="btn btn-secondary" id="options-btn" data-i18n="popup_options">Impostazioni</button>
      <button class="btn btn-primary" id="update-btn" data-i18n="popup_update_selectors">Aggiorna selettori</button>
    </footer>
  </div>
  <script type="module" src="../popup/popup.js"></script>
</body>
</html>
